<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="古镇夜景全景">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1a3a"/>
      <stop offset="55%" stop-color="#1c3166"/>
      <stop offset="100%" stop-color="#3a2a5a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#sky)"/>
  <!-- 月亮与光晕 -->
  <circle cx="650" cy="70" r="60" fill="#ffe9a8" opacity="0.12"/>
  <circle cx="650" cy="70" r="34" fill="#ffe9a8"/>
  <!-- 星星 -->
  <g fill="#ffffff">
    <circle cx="80" cy="50" r="1.8"/>
    <circle cx="180" cy="90" r="1.4"/>
    <circle cx="300" cy="40" r="2"/>
    <circle cx="420" cy="80" r="1.5"/>
    <circle cx="530" cy="45" r="1.8"/>
    <circle cx="740" cy="100" r="1.5"/>
    <circle cx="120" cy="140" r="1.3"/>
    <circle cx="380" cy="130" r="1.6"/>
    <circle cx="700" cy="150" r="1.3"/>
  </g>
  <!-- 远山 -->
  <path d="M0 300 L120 240 L260 300 L380 255 L520 310 L680 245 L800 295 L800 340 L0 340 Z" fill="#0e1c3d"/>
  <!-- 古镇建筑群 -->
  <g fill="#12264d">
    <rect x="40" y="240" width="70" height="100"/>
    <polygon points="40,240 75,200 110,240"/>
    <rect x="60" y="180" width="50" height="60"/>
    <polygon points="60,180 85,148 110,180"/>
    <rect x="120" y="260" width="90" height="80"/>
    <polygon points="120,260 165,215 210,260"/>
    <rect x="330" y="250" width="80" height="90"/>
    <polygon points="330,250 370,208 410,250"/>
    <rect x="420" y="270" width="70" height="70"/>
    <polygon points="420,270 455,233 490,270"/>
    <rect x="600" y="245" width="75" height="95"/>
    <polygon points="600,245 637,203 675,245"/>
    <rect x="680" y="265" width="80" height="75"/>
    <polygon points="680,265 720,223 760,265"/>
  </g>
  <!-- 古塔 -->
  <g fill="#16305f">
    <rect x="510" y="150" width="70" height="190"/>
    <rect x="500" y="128" width="90" height="30"/>
    <polygon points="545,82 500,128 590,128"/>
    <rect x="536" y="180" width="18" height="24" rx="9" fill="#ffe9a8" opacity="0.9"/>
    <rect x="536" y="235" width="18" height="24" rx="9" fill="#ffe9a8" opacity="0.6"/>
  </g>
  <!-- 红灯笼 -->
  <g fill="#e8552d">
    <rect x="40" y="212" width="10" height="16" rx="5"/>
    <rect x="120" y="232" width="10" height="16" rx="5"/>
    <rect x="330" y="222" width="10" height="16" rx="5"/>
    <rect x="600" y="218" width="10" height="16" rx="5"/>
    <rect x="512" y="118" width="10" height="16" rx="5"/>
  </g>
  <!-- 河流 -->
  <rect x="0" y="340" width="800" height="60" fill="#0f2347"/>
  <g stroke="#ffe9a8" opacity="0.15" stroke-width="2">
    <line x1="638" y1="352" x2="662" y2="352"/>
    <line x1="645" y1="364" x2="655" y2="364"/>
    <line x1="640" y1="376" x2="660" y2="376"/>
    <line x1="648" y1="386" x2="652" y2="386"/>
  </g>
  <!-- 拱桥剪影 -->
  <path d="M360 400 Q400 330 440 400 Z" fill="#0c1733"/>
</svg>
