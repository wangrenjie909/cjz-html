<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="古镇古塔夜景">
  <!-- 夜空 -->
  <rect width="400" height="300" fill="#0a1a3a"/>
  <!-- 月亮 -->
  <circle cx="320" cy="55" r="32" fill="#ffe9a8"/>
  <circle cx="310" cy="48" r="6" fill="#f5d98c" opacity="0.6"/>
  <!-- 星星 -->
  <circle cx="60" cy="40" r="2" fill="#ffffff" opacity="0.8"/>
  <circle cx="140" cy="80" r="1.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="230" cy="30" r="2" fill="#ffffff" opacity="0.9"/>
  <circle cx="90" cy="130" r="1.5" fill="#ffffff" opacity="0.5"/>
  <circle cx="360" cy="140" r="1.5" fill="#ffffff" opacity="0.7"/>
  <!-- 塔身 -->
  <g fill="#16305f">
    <rect x="150" y="180" width="100" height="90"/>
    <rect x="138" y="150" width="124" height="36"/>
    <rect x="158" y="100" width="84" height="54"/>
    <rect x="170" y="60" width="60" height="44"/>
  </g>
  <!-- 塔顶 -->
  <polygon points="200,12 158,60 242,60" fill="#16305f"/>
  <!-- 塔门 -->
  <path d="M185 270 v-25 a15 15 0 0 1 30 0 v25 z" fill="#0a1a3a"/>
  <!-- 塔窗 -->
  <rect x="192" y="115" width="16" height="22" rx="8" fill="#ffe9a8" opacity="0.9"/>
  <!-- 灯笼 -->
  <g fill="#e8552d">
    <rect x="118" y="150" width="18" height="28" rx="9"/>
    <rect x="264" y="150" width="18" height="28" rx="9"/>
    <rect x="121" y="146" width="12" height="4" rx="2" fill="#8a1f0a"/>
    <rect x="267" y="146" width="12" height="4" rx="2" fill="#8a1f0a"/>
    <rect x="121" y="178" width="12" height="4" rx="2" fill="#8a1f0a"/>
    <rect x="267" y="178" width="12" height="4" rx="2" fill="#8a1f0a"/>
  </g>
  <!-- 地面 -->
  <rect x="0" y="270" width="400" height="30" fill="#12264d"/>
</svg>
