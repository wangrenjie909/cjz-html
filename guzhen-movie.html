<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>古镇怪兽的传说 · 微电影</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #04060f; overflow: hidden; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
    #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: radial-gradient(ellipse at 50% 40%, #0a1124 0%, #04060f 70%); }
    #screen {
        position: relative; width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9;
        background: #060b18; border-radius: 6px; overflow: hidden;
        box-shadow: 0 0 80px rgba(80, 120, 220, 0.12), 0 0 24px rgba(0,0,0,0.8);
    }
    #screen.quake { animation: quake .28s; }
    @keyframes quake {
        0%,100%{ transform: translate(0,0); } 15%{ transform: translate(-7px,3px); }
        35%{ transform: translate(6px,-4px); } 55%{ transform: translate(-5px,-2px); } 75%{ transform: translate(4px,2px); }
    }
    #scene { position: absolute; inset: 0; width: 100%; height: 100%; }
    #barT, #barB { position: absolute; left: 0; right: 0; height: 9%; background: #000; z-index: 5; }
    #barT { top: 0; } #barB { bottom: 0; }
    #subtitle {
        position: absolute; left: 8%; right: 8%; bottom: 13%; text-align: center;
        color: #eef3ff; font-size: clamp(15px, 2.3vw, 26px); line-height: 1.7; z-index: 6;
        text-shadow: 0 2px 10px rgba(0,0,0,0.95), 0 0 30px rgba(0,0,0,0.6);
        opacity: 0; transition: opacity .8s ease; letter-spacing: 1px;
    }
    #chapterTag {
        position: absolute; top: 12%; left: 50%; transform: translateX(-50%);
        color: rgba(200, 216, 255, 0.55); font-size: clamp(11px, 1.3vw, 15px);
        letter-spacing: 6px; z-index: 6; transition: opacity .6s;
    }
    #progressWrap { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(255,255,255,0.08); z-index: 7; }
    #progress { height: 100%; width: 0%; background: linear-gradient(90deg, #ffd98a, #ff9d6e); }
    #controls { position: absolute; top: 10px; right: 12px; display: flex; gap: 8px; z-index: 8; }
    #controls button {
        background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.75); border: 1px solid rgba(255,255,255,0.15);
        padding: 6px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; transition: background .2s;
    }
    #controls button:hover { background: rgba(255,255,255,0.16); }
    #hint {
        position: absolute; right: 14px; bottom: 6%; color: rgba(180,200,240,0.4); font-size: 11px; z-index: 8; letter-spacing: 1px;
    }
    #endCard {
        position: absolute; inset: 0; z-index: 19; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 16px; background: rgba(4,6,15,0.85); opacity: 0; pointer-events: none; transition: opacity 1.2s;
    }
    #endCard.show { opacity: 1; pointer-events: auto; }
    #endCard h2 { color: #ffd98a; font-size: clamp(22px, 3.5vw, 40px); letter-spacing: 8px; }
    #endCard p { color: #9fb4e8; font-size: clamp(12px, 1.6vw, 16px); letter-spacing: 2px; }
    #endCard button {
        margin-top: 8px; background: rgba(255,255,255,0.1); color: #eef3ff; border: 1px solid rgba(255,255,255,0.25);
        padding: 10px 28px; border-radius: 30px; font-size: 14px; cursor: pointer; letter-spacing: 2px;
    }
    #endCard button:hover { background: rgba(255,255,255,0.2); }
    .tw { animation: twinkle 3s ease-in-out infinite; }
    @keyframes twinkle { 0%,100% { opacity: 1; } 50% { opacity: 0.2; } }
    .glow-red { animation: glowRed 1.6s ease-in-out infinite; }
    @keyframes glowRed { 0%,100% { opacity: .8; } 50% { opacity: 1; filter: drop-shadow(0 0 8px #ff5a3c); } }
    .glow-amber { animation: glowAmber 1.6s ease-in-out infinite; }
    @keyframes glowAmber { 0%,100% { opacity: .75; } 50% { opacity: 1; filter: drop-shadow(0 0 10px #ffb347); } }
    .fog-move { animation: fogMove 10s ease-in-out infinite alternate; }
    @keyframes fogMove { from { transform: translateX(-30px); } to { transform: translateX(30px); } }
    .clouds { animation: cloudDrift 45s linear infinite; }
    @keyframes cloudDrift { from { transform: translateX(-50px); } to { transform: translateX(50px); } }
    .lantern-pulse { animation: lanternPulse 2.2s ease-in-out infinite; }
    @keyframes lanternPulse { 0%,100% { opacity: .75; } 50% { opacity: 1; } }
    .wing-flap { animation: wingFlap .5s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
    @keyframes wingFlap { from { transform: scale(1, 1); } to { transform: scale(1.06, 0.94); } }
    #scene .swap { transition: opacity .5s ease; }
    .fx-ring { fill: none; stroke-width: 3; animation: ringOut .55s ease-out forwards; }
    @keyframes ringOut { from { r: 8; opacity: .9; } to { r: 70; opacity: 0; } }
    .fx-spark { animation: sparkFly .6s ease-out forwards; }
    @keyframes sparkFly { from { opacity: 1; } to { opacity: 0; transform: translate(var(--dx), var(--dy)); } }
    .fx-arrow { animation: arrowFly .5s ease-out forwards; }
    @keyframes arrowFly { from { opacity: 1; } to { opacity: 0; transform: translate(var(--dx), var(--dy)); } }
    /* ✨ 特效增强：流星 / 转场闪光 / 锁链晃动 */
    .meteor { position: absolute; width: 90px; height: 2px; background: linear-gradient(90deg, rgba(255,255,255,0.9), transparent); border-radius: 2px; pointer-events: none; z-index: 4; animation: meteorFly 1.1s ease-out forwards; }
    @keyframes meteorFly { from { transform: translate(0,0) rotate(-22deg); opacity: 1; } to { transform: translate(-280px, 110px) rotate(-22deg); opacity: 0; } }
    /* 转场闪光层（独立元素，不与 #screen.quake 的 animation 冲突） */
    #flashOverlay { position: absolute; inset: 0; z-index: 3; background: #fff; opacity: 0; pointer-events: none; }
    #flashOverlay.on { animation: flashFade .45s ease-out; }
    @keyframes flashFade { 0% { opacity: .45; } 100% { opacity: 0; } }
    #chains { transform-box: fill-box; transform-origin: center; animation: chainSway 3s ease-in-out infinite alternate; }
    @keyframes chainSway { from { transform: rotate(-1.6deg); } to { transform: rotate(1.6deg); } }
</style>
</head>
<body>
<div id="stage">
    <div id="screen">
        <svg id="scene" viewBox="0 0 960 540" preserveAspectRatio="xMidYMid slice">
            <defs>
                <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#02040d"/>
                    <stop offset="28%" stop-color="#070d24"/>
                    <stop offset="58%" stop-color="#131f45"/>
                    <stop offset="84%" stop-color="#2a2f63"/>
                    <stop offset="100%" stop-color="#41386e"/>
                </linearGradient>
                <linearGradient id="milkyG" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0%" stop-color="#aebfef" stop-opacity="0"/>
                    <stop offset="50%" stop-color="#cdd9f7" stop-opacity="0.45"/>
                    <stop offset="100%" stop-color="#aebfef" stop-opacity="0"/>
                </linearGradient>
                <linearGradient id="waterG" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#0a1630"/><stop offset="100%" stop-color="#040914"/>
                </linearGradient>
                <radialGradient id="moonG" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#dbe6ff" stop-opacity="0.9"/><stop offset="45%" stop-color="#9fb4e8" stop-opacity="0.35"/><stop offset="100%" stop-color="#9fb4e8" stop-opacity="0"/>
                </radialGradient>
                <radialGradient id="lampG" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#ffe9b0" stop-opacity="0.9"/><stop offset="100%" stop-color="#ffd98a" stop-opacity="0"/>
                </radialGradient>
                <radialGradient id="beamG" cx="50%" cy="0%" r="80%">
                    <stop offset="0%" stop-color="#9fb4e8" stop-opacity="0.16"/><stop offset="100%" stop-color="#9fb4e8" stop-opacity="0"/>
                </radialGradient>
                <linearGradient id="fireG" x1="0" y1="1" x2="0" y2="0">
                    <stop offset="0%" stop-color="#ff5a3c"/><stop offset="60%" stop-color="#ff9d6e"/><stop offset="100%" stop-color="#ffe9b0"/>
                </linearGradient>
                <!-- 探险团 3D 立体渐变（p1 亮 / p2 中 / p3 深） -->
                <linearGradient id="p1G" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#f6f9ff"/><stop offset="100%" stop-color="#93a9cf"/>
                </linearGradient>
                <radialGradient id="p1H" cx="35%" cy="30%" r="75%">
                    <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#b6cae6"/>
                </radialGradient>
                <linearGradient id="p2G" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#e6eefc"/><stop offset="100%" stop-color="#7f96c2"/>
                </linearGradient>
                <radialGradient id="p2H" cx="35%" cy="30%" r="75%">
                    <stop offset="0%" stop-color="#f8fbff"/><stop offset="100%" stop-color="#9fb2d6"/>
                </radialGradient>
                <linearGradient id="p3G" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#d4def2"/><stop offset="100%" stop-color="#687ba8"/>
                </linearGradient>
                <radialGradient id="p3H" cx="35%" cy="30%" r="75%">
                    <stop offset="0%" stop-color="#eaf0ff"/><stop offset="100%" stop-color="#8294c0"/>
                </radialGradient>
            </defs>

            <!-- ═══ 外景·夜（幕0/7） ═══ -->
            <g id="gOuter" class="swap">
                <rect width="960" height="540" fill="url(#skyG)"/>
                <!-- 银河 -->
                <path d="M-40 30 Q 180 -40 380 30 Q 580 100 760 70 Q 880 48 1000 78 L 1000 150 Q 820 120 640 170 Q 460 210 260 140 Q 90 80 -40 110 Z" fill="url(#milkyG)" opacity="0.5"/>
                <path d="M-40 60 Q 200 -10 400 50 Q 600 120 760 90 Q 880 68 1000 98 L 1000 120 Q 820 95 640 140 Q 460 180 260 115 Q 90 60 -40 85 Z" fill="url(#milkyG)" opacity="0.3"/>
                <!-- 星星（缀在银河之上） -->
                <g fill="#dbe6ff">
                    <circle class="tw" cx="90" cy="70" r="1.4"/><circle class="tw" cx="210" cy="40" r="1" style="animation-delay:.8s"/>
                    <circle class="tw" cx="340" cy="95" r="1.6" style="animation-delay:1.6s"/><circle class="tw" cx="470" cy="52" r="1" style="animation-delay:.4s"/>
                    <circle class="tw" cx="610" cy="80" r="1.5" style="animation-delay:1.2s"/><circle class="tw" cx="760" cy="46" r="1.2" style="animation-delay:2s"/>
                    <circle class="tw" cx="880" cy="100" r="1.6" style="animation-delay:.6s"/><circle class="tw" cx="540" cy="130" r="1" style="animation-delay:1.8s"/>
                </g>
                <!-- 亮星（带光晕） -->
                <circle cx="470" cy="52" r="10" fill="url(#moonG)" opacity="0.5"/>
                <circle cx="760" cy="46" r="8" fill="url(#moonG)" opacity="0.4"/>
                <circle cx="880" cy="100" r="9" fill="url(#moonG)" opacity="0.45"/>
                <!-- 月亮（双层光晕） -->
                <circle cx="180" cy="120" r="170" fill="url(#moonG)"/>
                <circle cx="180" cy="120" r="95" fill="url(#moonG)"/>
                <circle cx="180" cy="120" r="30" fill="#e8efff"/>
                <circle cx="176" cy="116" r="26" fill="#f4f7ff" opacity="0.9"/>
                <circle cx="186" cy="124" r="6" fill="#c9d6f2" opacity="0.6"/>
                <!-- 夜云（在月光下缓缓飘动） -->
                <g class="clouds" fill="#202a5a" opacity="0.55">
                    <ellipse cx="330" cy="168" rx="120" ry="17"/>
                    <ellipse cx="430" cy="161" rx="80" ry="13"/>
                    <ellipse cx="240" cy="162" rx="70" ry="11"/>
                </g>
                <g class="clouds" fill="#33396e" opacity="0.4" style="animation-delay:6s">
                    <ellipse cx="760" cy="196" rx="140" ry="17"/>
                    <ellipse cx="870" cy="188" rx="90" ry="13"/>
                    <ellipse cx="650" cy="190" rx="70" ry="11"/>
                </g>
                <!-- 远山（两层，更远更浅） -->
                <path d="M0 292 L96 224 L196 284 L300 236 L408 292 L520 234 L636 290 L756 242 L868 292 L960 258 L960 330 L0 330 Z" fill="#0d1636" opacity="0.55"/>
                <path d="M0 330 L120 250 L230 320 L340 268 L460 330 L580 250 L700 320 L820 262 L960 330 L960 420 L0 420 Z" fill="#0a1230" opacity="0.88"/>
                <!-- 山前夜雾 -->
                <ellipse class="fog-move" cx="480" cy="300" rx="520" ry="26" fill="#8fb0e0" opacity="0.07"/>
                <ellipse class="fog-move" cx="420" cy="330" rx="460" ry="22" fill="#8fb0e0" opacity="0.06" style="animation-delay:3s"/>
                <g id="town" fill="#070d20">
                    <path d="M0 420 L0 380 L60 350 L120 380 L120 420 Z"/>
                    <path d="M120 420 L120 368 L200 330 L280 368 L280 420 Z"/>
                    <path d="M280 420 L280 372 L360 338 L440 372 L440 420 Z"/>
                    <path d="M440 420 L440 362 L520 324 L600 362 L600 420 Z"/>
                    <path d="M600 420 L600 376 L700 342 L800 376 L800 420 Z"/>
                    <path d="M800 420 L800 366 L880 336 L960 366 L960 420 Z"/>
                </g>
                <g id="tower" transform="translate(640 0)">
                    <path d="M0 420 L0 300 L-30 300 L-30 260 L-16 260 L-16 220 L16 220 L16 260 L30 260 L30 300 L0 300 Z" fill="#060b1c"/>
                    <path d="M-40 260 L-24 196 L24 196 L40 260 Z" fill="#070d20"/>
                    <path d="M-16 196 L0 148 L16 196 Z" fill="#080f24"/>
                    <rect x="-7" y="300" width="14" height="120" fill="#0a1226"/>
                    <circle id="towerLight" cx="0" cy="182" r="5" fill="#ffd98a" opacity="0.4" class="lantern-pulse"/>
                </g>
                <rect y="420" width="960" height="120" fill="url(#waterG)"/>
                <g stroke="#2a4a86" stroke-width="1" opacity="0.3">
                    <line x1="80" y1="452" x2="180" y2="452"/><line x1="300" y1="486" x2="420" y2="486"/>
                    <line x1="540" y1="458" x2="660" y2="458"/><line x1="760" y1="492" x2="880" y2="492"/>
                </g>
                <ellipse cx="180" cy="432" rx="70" ry="10" fill="#9fb4e8" opacity="0.14"/>
                <ellipse cx="180" cy="448" rx="48" ry="8" fill="#9fb4e8" opacity="0.12"/>
                <ellipse cx="180" cy="468" rx="32" ry="6" fill="#9fb4e8" opacity="0.1"/>
                <ellipse cx="180" cy="488" rx="20" ry="4" fill="#9fb4e8" opacity="0.08"/>
            </g>

            <!-- ═══ 塔内（幕1-6） ═══ -->
            <g id="gInner" class="swap" opacity="0">
                <rect width="960" height="540" fill="#0a0d1c"/>
                <path d="M0 0 L0 150 Q90 120 220 130 L220 0 Z" fill="#101531"/>
                <path d="M960 0 L960 160 Q880 130 760 140 L760 0 Z" fill="#101531"/>
                <!-- 地板（含机关方格） -->
                <rect y="470" width="960" height="70" fill="#0c0f20"/>
                <g stroke="#1c2448" stroke-width="2" opacity="0.5">
                    <line x1="40" y1="480" x2="200" y2="480"/><line x1="260" y1="500" x2="460" y2="500"/>
                    <line x1="540" y1="490" x2="740" y2="490"/><line x1="800" y1="510" x2="940" y2="510"/>
                </g>
                <g id="trapGrid" stroke="#2a3560" stroke-width="1.4" opacity="0.5">
                    <line x1="300" y1="470" x2="300" y2="540"/><line x1="360" y1="470" x2="360" y2="540"/>
                    <line x1="420" y1="470" x2="420" y2="540"/><line x1="480" y1="470" x2="480" y2="540"/>
                    <line x1="540" y1="470" x2="540" y2="540"/><line x1="600" y1="470" x2="600" y2="540"/>
                    <line x1="660" y1="470" x2="660" y2="540"/>
                </g>
                <rect x="300" y="0" width="360" height="540" fill="url(#beamG)"/>
                <g fill="#9fb4e8" opacity="0.3">
                    <circle class="tw" cx="420" cy="180" r="1.2" style="animation-delay:.5s"/>
                    <circle class="tw" cx="520" cy="230" r="1" style="animation-delay:1.4s"/>
                    <circle class="tw" cx="470" cy="300" r="1.3" style="animation-delay:.9s"/>
                    <circle class="tw" cx="380" cy="260" r="1.4" style="animation-delay:.3s"/>
                    <circle class="tw" cx="610" cy="170" r="1.1" style="animation-delay:1.9s"/>
                    <circle class="tw" cx="540" cy="350" r="1.4" style="animation-delay:2.5s"/>
                    <circle class="tw" cx="670" cy="290" r="1.2" style="animation-delay:.7s"/>
                    <circle class="tw" cx="450" cy="120" r="1.1" style="animation-delay:3s"/>
                </g>
                <!-- 楼梯 -->
                <g stroke="#16204a" stroke-width="2.5" opacity="0.6">
                    <line x1="120" y1="470" x2="150" y2="440"/><line x1="150" y1="440" x2="150" y2="470"/>
                    <line x1="150" y1="470" x2="180" y2="440"/><line x1="180" y1="440" x2="180" y2="470"/>
                    <line x1="180" y1="470" x2="210" y2="440"/><line x1="210" y1="440" x2="210" y2="470"/>
                    <line x1="210" y1="470" x2="240" y2="440"/><line x1="240" y1="440" x2="240" y2="470"/>
                </g>
            </g>

            <!-- ═══ 三头火龙（幕4-6） ═══ -->
            <g id="dragon" transform="translate(640 0)" opacity="0">
                <!-- 锁链（千锁的象征） -->
                <g id="chains" stroke="#5a6478" stroke-width="3.5" fill="none" opacity="0.9">
                    <path d="M-170 300 L-70 250 M-170 350 L-80 340 M170 300 L70 250 M170 350 L80 340"/>
                    <path d="M-150 440 L-60 410 M150 440 L60 410 M0 170 L0 90"/>
                    <path d="M-90 240 L-40 220 M90 240 L40 220"/>
                </g>
                <!-- 尾巴 -->
                <path d="M-70 400 Q-130 420 -150 470 Q-160 490 -140 496" stroke="#3a1d14" stroke-width="14" fill="none" stroke-linecap="round"/>
                <polygon points="-140,496 -160,512 -130,508" fill="#3a1d14"/>
                <!-- 身体 -->
                <ellipse cx="0" cy="380" rx="95" ry="62" fill="#3a1d14" stroke="#e8552d" stroke-width="4"/>
                <ellipse cx="0" cy="392" rx="70" ry="40" fill="#4a2418"/>
                <!-- 腿 -->
                <path d="M-60 420 L-80 468 L-64 468" stroke="#3a1d14" stroke-width="16" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M60 420 L80 468 L64 468" stroke="#3a1d14" stroke-width="16" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                <!-- 翅膀 -->
                <g class="wing-flap">
                    <path id="wingL" d="M-80 320 Q-180 250 -220 300 Q-190 340 -120 350 Q-95 340 -84 336 Z" fill="#4a2418" stroke="#e8552d" stroke-width="3"/>
                    <path id="wingR" d="M80 320 Q180 250 220 300 Q190 340 120 350 Q95 340 84 336 Z" fill="#4a2418" stroke="#e8552d" stroke-width="3"/>
                </g>
                <!-- 中头（大头） -->
                <g>
                    <ellipse cx="0" cy="228" rx="38" ry="34" fill="#3a1d14" stroke="#e8552d" stroke-width="4"/>
                    <polygon points="-18,200 -30,168 -6,192" fill="#2b140e" stroke="#e8552d" stroke-width="2"/>
                    <polygon points="18,200 30,168 6,192" fill="#2b140e" stroke="#e8552d" stroke-width="2"/>
                    <ellipse id="dEyeC1" class="glow-amber" cx="-14" cy="226" rx="5" ry="4.5" fill="#ffb347"/>
                    <ellipse id="dEyeC2" class="glow-amber" cx="14" cy="226" rx="5" ry="4.5" fill="#ffb347"/>
                    <path id="dMouthC" d="M-16 250 Q0 262 16 250" stroke="#e8552d" stroke-width="3.5" fill="none"/>
                </g>
                <!-- 左头 -->
                <g>
                    <ellipse cx="-72" cy="252" rx="26" ry="24" fill="#3a1d14" stroke="#e8552d" stroke-width="3.5"/>
                    <polygon points="-86,236 -96,212 -76,230" fill="#2b140e" stroke="#e8552d" stroke-width="2"/>
                    <ellipse id="dEyeL1" class="glow-amber" cx="-80" cy="250" rx="4" ry="3.6" fill="#ffb347"/>
                    <ellipse id="dEyeL2" class="glow-amber" cx="-64" cy="250" rx="4" ry="3.6" fill="#ffb347"/>
                    <path d="M-86 268 Q-72 276 -58 268" stroke="#e8552d" stroke-width="3" fill="none"/>
                </g>
                <!-- 右头 -->
                <g>
                    <ellipse cx="72" cy="252" rx="26" ry="24" fill="#3a1d14" stroke="#e8552d" stroke-width="3.5"/>
                    <polygon points="86,236 96,212 76,230" fill="#2b140e" stroke="#e8552d" stroke-width="2"/>
                    <ellipse id="dEyeR1" class="glow-amber" cx="64" cy="250" rx="4" ry="3.6" fill="#ffb347"/>
                    <ellipse id="dEyeR2" class="glow-amber" cx="80" cy="250" rx="4" ry="3.6" fill="#ffb347"/>
                    <path d="M58 268 Q72 276 86 268" stroke="#e8552d" stroke-width="3" fill="none"/>
                </g>
                <!-- 喉间火光 -->
                <ellipse id="throatGlow" cx="0" cy="258" rx="16" ry="8" fill="#ff9d6e" opacity="0.25" class="lantern-pulse"/>
            </g>

            <!-- ═══ 探险团 ═══ -->
            <g id="team" opacity="0">
                <!-- 队长（提灯） -->
                <g id="p1" transform="translate(240 0)">
                    <ellipse cx="0" cy="468" rx="26" ry="6" fill="rgba(0,0,0,0.35)"/>
                    <ellipse cx="0" cy="466" rx="34" ry="9" fill="#ffd98a" opacity="0.14"/>
                    <line id="p1LegA" x1="0" y1="400" x2="-10" y2="464" stroke="url(#p1G)" stroke-width="8" stroke-linecap="round"/>
                    <line id="p1LegB" x1="0" y1="400" x2="10" y2="464" stroke="url(#p1G)" stroke-width="8" stroke-linecap="round"/>
                    <rect x="-9" y="352" width="18" height="50" rx="9" fill="url(#p1G)" stroke="#0a1428" stroke-width="1.2"/>
                    <line id="p1ArmA" x1="0" y1="364" x2="-16" y2="375" stroke="url(#p1G)" stroke-width="6" stroke-linecap="round"/>
                    <line id="p1ArmB" x1="0" y1="366" x2="20" y2="371" stroke="url(#p1G)" stroke-width="6" stroke-linecap="round"/>
                    <circle cx="0" cy="340" r="15" fill="url(#p1H)" stroke="#0a1428" stroke-width="1.2"/>
                    <ellipse cx="-4" cy="335" rx="4" ry="2.5" fill="rgba(255,255,255,0.55)"/>
                    <g id="p1Face"><circle cx="-5" cy="338" r="2.4" fill="#0a1428"/><circle cx="5" cy="338" r="2.4" fill="#0a1428"/></g>
                    <g id="p1Lantern">
                        <line x1="22" y1="370" x2="34" y2="386" stroke="#eaf2ff" stroke-width="3"/>
                        <circle class="lantern-pulse" cx="41" cy="394" r="20" fill="url(#lampG)"/>
                        <circle cx="41" cy="394" r="4.5" fill="#ffd98a"/>
                    </g>
                </g>
                <!-- 队员2（火把） -->
                <g id="p2" transform="translate(310 0) scale(0.88)">
                    <ellipse cx="0" cy="464" rx="22" ry="5" fill="rgba(0,0,0,0.32)"/>
                    <line id="p2LegA" x1="0" y1="404" x2="-9" y2="462" stroke="url(#p2G)" stroke-width="7" stroke-linecap="round"/>
                    <line id="p2LegB" x1="0" y1="404" x2="9" y2="462" stroke="url(#p2G)" stroke-width="7" stroke-linecap="round"/>
                    <rect x="-8" y="358" width="16" height="48" rx="8" fill="url(#p2G)" stroke="#0a1428" stroke-width="1.2"/>
                    <line id="p2Arm" x1="0" y1="370" x2="20" y2="378" stroke="url(#p2G)" stroke-width="5.5" stroke-linecap="round"/>
                    <circle cx="0" cy="346" r="13.5" fill="url(#p2H)" stroke="#0a1428" stroke-width="1.2"/>
                    <ellipse cx="-3" cy="342" rx="3.5" ry="2.3" fill="rgba(255,255,255,0.5)"/>
                    <g id="p2Torch">
                        <line x1="22" y1="376" x2="26" y2="392" stroke="#cdd8f0" stroke-width="2.5"/>
                        <circle class="lantern-pulse" cx="27" cy="398" r="12" fill="url(#lampG)"/>
                        <ellipse cx="27" cy="396" rx="3.5" ry="6" fill="#ff9d6e"/>
                    </g>
                </g>
                <!-- 队员3（背袋） -->
                <g id="p3" transform="translate(380 0) scale(0.88)">
                    <ellipse cx="0" cy="464" rx="22" ry="5" fill="rgba(0,0,0,0.32)"/>
                    <line id="p3LegA" x1="0" y1="404" x2="-9" y2="462" stroke="url(#p3G)" stroke-width="7" stroke-linecap="round"/>
                    <line id="p3LegB" x1="0" y1="404" x2="9" y2="462" stroke="url(#p3G)" stroke-width="7" stroke-linecap="round"/>
                    <rect x="-8" y="358" width="16" height="48" rx="8" fill="url(#p3G)" stroke="#0a1428" stroke-width="1.2"/>
                    <path d="M-16 370 Q-24 386 -20 404 L-12 402 Q-14 386 -10 372 Z" fill="#2a3560"/>
                    <line id="p3Arm" x1="0" y1="370" x2="-16" y2="380" stroke="url(#p3G)" stroke-width="5.5" stroke-linecap="round"/>
                    <circle cx="0" cy="346" r="13.5" fill="url(#p3H)" stroke="#0a1428" stroke-width="1.2"/>
                    <ellipse cx="-3" cy="342" rx="3.5" ry="2.3" fill="rgba(255,255,255,0.5)"/>
                </g>
            </g>

            <!-- ═══ 特效层 ═══ -->
            <g id="fx"></g>
        </svg>

        <div id="barT"></div><div id="barB"></div>
        <div id="flashOverlay"></div>
        <div id="chapterTag">序 · 夜</div>
        <div id="subtitle"></div>
        <div id="progressWrap"><div id="progress"></div></div>
        <div id="hint">点画面开启音效</div>
        <div id="controls">
            <button id="pauseBtn" onclick="togglePause()">⏸ 暂停</button>
            <button onclick="restart()">↺ 重播</button>
        </div>
    </div>
    <div id="endCard">
        <h2>《古镇怪兽的传说》· 完</h2>
        <p>一千条锁链锁住的，是一颗想回家的心</p>
        <button onclick="restart()">↺ 再看一遍</button>
    </div>
</div>

<script>
    // ═══════════ 章节与时长 ═══════════
    const CHS = [
        { name: '序 · 夜',        dur: 11 },
        { name: '第一章 · 入塔',  dur: 11 },
        { name: '第二章 · 机关',  dur: 12 },
        { name: '第三章 · 箭雨',  dur: 13 },
        { name: '第四章 · 登顶',  dur: 14 },
        { name: '第五章 · 激战',  dur: 16 },
        { name: '第六章 · 真相',  dur: 13 },
        { name: '第七章 · 放龙',  dur: 14 }
    ];
    const TOTAL = CHS.reduce((a, c) => a + c.dur, 0);
    const ST = [];
    { let acc = 0; CHS.forEach(c => { ST.push(acc); acc += c.dur; }); }

    // 字幕： [开始秒, 持续秒, 文本]
    const LINES = [
        [0.5, 5,   '宁静的夜晚，一支探险队来到传说中的废弃古塔。'],
        [7, 4,     '传说，塔里镇压着八千年的怪兽。'],
        [12, 5,    '走进古塔，他们听到了奇怪的声音……'],
        [23, 2,    '机关遍布古塔。怪兽，在最顶层。'],
        [25, 2.5,  '走到一半——'],
        [36, 5,    '无数支箭，从黑暗中射来！'],
        [42, 3,    '脚下的方格，一踩就塌。'],
        [45, 2,    '他们凭借灵活与智慧，逃了出来！'],
        [48.5, 5,  '终于，他们见到了传说中的怪兽。'],
        [54, 5,    '三只头，一双翅膀，口吐烈焰。'],
        [59, 2,    '它拼命想飞走，却被一千条锁链困住。'],
        [63, 4,    '火龙喷出烈焰！'],
        [68, 5,    '他们跃过火海，拔出特效刀迎战。'],
        [73.5, 3.5,'战斗，十分激烈……'],
        [78, 5,    '「我是天上的火龙……那天不小心坠落人间……」'],
        [85, 5,    '「他们，就把我锁在这里。」'],
        [92, 4,    '探险队解开了锁链。'],
        [97, 4,    '火龙道谢一声，展翅飞回天空。'],
        [101, 2,   '夜，重归宁静。'],
        [103, 1,   '《古镇怪兽的传说》· 完']
    ];

    // ═══════════ 状态 ═══════════
    let t = 0, last = 0, playing = false, chapter = -1, lastLine = null;
    let actx = null, drone = null, tickTimer = null;
    let lastHit = -1;             // 激战命中边沿检测
    let lastLand = -1;            // 箭雨落地震动一次性标志

    const $ = id => document.getElementById(id);
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const setOp = (id, v) => { const el = $(id); if (el) el.style.opacity = v; };

    function chIndex() {
        for (let i = CHS.length - 1; i >= 0; i--) { if (t >= ST[i]) { return i; } }
        return 0;
    }

    // ═══════════ 特效 ═══════════
    function spark(x, y, color, n, spread) {
        const fx = $('fx');
        for (let i = 0; i < n; i++) {
            const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            c.setAttribute('cx', x); c.setAttribute('cy', y);
            c.setAttribute('r', 1.5 + Math.random() * 2.5);
            c.setAttribute('fill', color);
            c.setAttribute('class', 'fx-spark');
            const a = Math.random() * Math.PI * 2, d = spread * (0.4 + Math.random() * 0.6);
            c.style.setProperty('--dx', (Math.cos(a) * d) + 'px');
            c.style.setProperty('--dy', (Math.sin(a) * d) + 'px');
            fx.appendChild(c);
            setTimeout(() => c.remove(), 620);
        }
    }
    function ring(x, y, color) {
        const fx = $('fx');
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('cx', x); c.setAttribute('cy', y);
        c.setAttribute('stroke', color); c.setAttribute('class', 'fx-ring');
        fx.appendChild(c);
        setTimeout(() => c.remove(), 600);
    }
    // 🏹 箭：从一侧飞向另一侧
    function arrow(x, y, dir) {
        const fx = $('fx');
        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        g.setAttribute('class', 'fx-arrow');
        const ln = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        ln.setAttribute('x1', 0); ln.setAttribute('y1', 0);
        ln.setAttribute('x2', dir * 26); ln.setAttribute('y2', 0);
        ln.setAttribute('stroke', '#c8d2ea'); ln.setAttribute('stroke-width', '2');
        const tip = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
        tip.setAttribute('points', (dir * 26) + ',-3 ' + (dir * 32) + ',0 ' + (dir * 26) + ',3');
        tip.setAttribute('fill', '#e6ecff');
        g.appendChild(ln); g.appendChild(tip);
        g.setAttribute('transform', 'translate(' + x + ' ' + y + ')');
        g.style.setProperty('--dx', (dir * 260) + 'px');
        g.style.setProperty('--dy', (Math.random() * 60 - 30) + 'px');
        fx.appendChild(g);
        setTimeout(() => g.remove(), 520);
    }
    function quake() {
        const s = $('screen');
        s.classList.remove('quake'); void s.offsetWidth; s.classList.add('quake');
    }
    // 🌠 流星（夜空划过）
    function spawnMeteor() {
        const sc = $('screen');
        const m = document.createElement('div');
        m.className = 'meteor';
        m.style.left = (400 + Math.random() * 420) + 'px';
        m.style.top = (30 + Math.random() * 170) + 'px';
        sc.appendChild(m);
        setTimeout(() => m.remove(), 1200);
    }

    // ═══════════ 章节进入 ═══════════
    const enter = [
        () => { setOp('gOuter', 1); setOp('gInner', 0); setOp('dragon', 0); setOp('team', 1); },
        () => { setOp('gOuter', 0); setOp('gInner', 1); setOp('dragon', 0); setOp('team', 1); },
        () => { setOp('gOuter', 0); setOp('gInner', 1); setOp('dragon', 0); setOp('team', 1); },
        () => { setOp('gOuter', 0); setOp('gInner', 1); setOp('dragon', 0); setOp('team', 1); },
        () => { setOp('gOuter', 0); setOp('gInner', 1); setOp('dragon', 1); setOp('team', 1); },
        () => { setOp('gOuter', 0); setOp('gInner', 1); setOp('dragon', 1); setOp('team', 1); },
        () => { setOp('gOuter', 0); setOp('gInner', 1); setOp('dragon', 1); setOp('team', 1); },
        () => { setOp('gOuter', 1); setOp('gInner', 0); setOp('dragon', 1); setOp('team', 1); }
    ];

    function onChapter(i) {
        chapter = i;
        $('chapterTag').textContent = CHS[i].name;
        if (enter[i]) { enter[i](); }
        if (actx) { onChapterAudio(i); }
        // ✨ 转场闪光（独立层，不阻塞 quake 震动）
        const fo = $('flashOverlay');
        fo.classList.remove('on');
        void fo.offsetWidth;
        fo.classList.add('on');
        setTimeout(() => fo.classList.remove('on'), 500);
    }

    // ═══════════ 章节动画 ═══════════
    // 探险团走路（p1 队长，p2/p3 跟随；dy 可整体上移，外景站立用）
    function teamWalk(px1, px2, px3, spd, amp, dy) {
        dy = dy || 0;
        const s = Math.sin(t * 9 * spd) * amp;
        $('p1LegA').setAttribute('transform', 'rotate(' + (-s) + ' 0 400)');
        $('p1LegB').setAttribute('transform', 'rotate(' + s + ' 0 400)');
        const s2 = Math.sin(t * 9 * spd + 1.2) * amp * 0.9;
        $('p2LegA').setAttribute('transform', 'rotate(' + (-s2) + ' 0 404)');
        $('p2LegB').setAttribute('transform', 'rotate(' + s2 + ' 0 404)');
        const s3 = Math.sin(t * 9 * spd + 2.4) * amp * 0.9;
        $('p3LegA').setAttribute('transform', 'rotate(' + (-s3) + ' 0 404)');
        $('p3LegB').setAttribute('transform', 'rotate(' + s3 + ' 0 404)');
        $('p1').setAttribute('transform', 'translate(' + px1 + ' ' + dy + ')');
        $('p2').setAttribute('transform', 'translate(' + px2 + ' ' + dy + ') scale(0.88)');
        $('p3').setAttribute('transform', 'translate(' + px3 + ' ' + dy + ') scale(0.88)');
    }
    // 探险团站定（摆臂微动；dy 可整体上移）
    function teamStand(baseX, sway, dy) {
        dy = dy || 0;
        const s = Math.sin(t * 1.6) * (sway || 4);
        $('p1').setAttribute('transform', 'translate(' + baseX + ' ' + dy + ')');
        $('p2').setAttribute('transform', 'translate(' + (baseX + 60) + ' ' + dy + ') scale(0.88)');
        $('p3').setAttribute('transform', 'translate(' + (baseX + 118) + ' ' + dy + ') scale(0.88)');
        $('p1ArmA').setAttribute('transform', 'rotate(' + s + ' 0 364)');
    }
    // 探险团跳跃（ch3 箭雨躲闪 / ch5 跃火），空中投影变淡
    function teamJump(baseX, phase, jumpAmp) {
        const j = Math.max(0, Math.sin(phase)) * (jumpAmp || 26);
        const base = baseX - j * 0.5;
        $('p1').setAttribute('transform', 'translate(' + base + ' ' + (-j) + ')');
        $('p2').setAttribute('transform', 'translate(' + (base + 52) + ' ' + (-j * 0.9) + ') scale(0.88)');
        $('p3').setAttribute('transform', 'translate(' + (base + 104) + ' ' + (-j * 0.8) + ') scale(0.88)');
        // 空中影子变淡（投影在角色内部，随跳变淡）
        const sh = Math.max(0.15, 1 - j / 45);
        ['p1', 'p2', 'p3'].forEach(id => {
            const g = $(id);
            const shEl = g ? g.querySelector('ellipse') : null;
            if (shEl) { shEl.setAttribute('opacity', sh); }
        });
        if (j > 2) {
            const sl = Math.sin(t * 16) * 10;
            $('p1LegA').setAttribute('transform', 'rotate(' + (-sl) + ' 0 400)');
            $('p1LegB').setAttribute('transform', 'rotate(' + sl + ' 0 400)');
        }
    }

    const update = [
        // 0 夜·到来：探险团从右侧走向古塔
        (p) => {
            const x = 780 - p * 420;
            teamWalk(x, x + 64, x + 126, 1.1, 16, -40);   // 外景站立于岸上
            setOp('team', 1);
            // 🌠 流星划过夜空
            if (Math.random() < 0.02) { spawnMeteor(); }
        },
        // 1 入塔·怪声：走进塔内，灯晃，怪声波纹
        (p) => {
            teamWalk(300, 362, 424, 0.8, 12);
            // 灯笼晃动 + 声波纹
            const sw = Math.sin(t * 3) * 8;
            $('p1Lantern').setAttribute('transform', 'rotate(' + sw + ' 22 370)');
            if (Math.random() < 0.12) { ring(420 + Math.random() * 160, 300 + Math.random() * 120, '#9fb4e8'); }
        },
        // 2 机关·坠落：踩到陷阱，地板裂开，坠落
        (p) => {
            const c = (t - ST[2]) % 5;
            let y = 0, boom = false, gone = false;
            if (c < 3.2) {
                teamWalk(300, 362, 424, 0.7, 10);          // 沿楼梯往上走
            } else if (c < 4) {
                y = ((c - 3.2) / 0.8) * 120;               // 陷阱塌陷，坠落下去
                boom = true;
                if (c > 3.7) { gone = true; }
            } else {
                y = 120; gone = true;                       // 掉到下层（画面外）
            }
            if (boom) { quake(); spark(360, 470, '#c8d2ea', 10, 60); }
            const flick = Math.random() < 0.3;
            $('trapGrid').setAttribute('opacity', flick ? 0.2 : 0.6);
            setOp('team', gone ? 0 : 1);
            $('p1').setAttribute('transform', 'translate(300 ' + y + ')');
            $('p2').setAttribute('transform', 'translate(362 ' + (y + 8) + ') scale(0.88)');
            $('p3').setAttribute('transform', 'translate(424 ' + (y + 14) + ') scale(0.88)');
        },
        // 3 箭雨·逃生：箭从两侧射来，方格塌陷，团队跳跃闪避
        (p) => {
            const c = (t - ST[3]) % 3;
            // 箭雨
            if (Math.random() < 0.5) {
                const dir = Math.random() < 0.5 ? 1 : -1;
                arrow(dir > 0 ? 60 : 900, 330 + Math.random() * 130, dir);
            }
            // 方格塌陷闪烁
            if (Math.random() < 0.2) { spark(300 + Math.random() * 400, 475, '#c8d2ea', 3, 30); }
            // 团队跳跃闪避（每 3 秒一轮），落地瞬间震动
            teamJump(300, c * Math.PI * 2, 30);
            if (c > 1.42 && c < 1.47 && lastLand !== 3) { lastLand = 3; quake(); }
            if (c >= 1.5) { lastLand = -1; }
        },
        // 4 登顶·火龙：火龙从暗处浮现，锁链显形，团队后退
        (p) => {
            setOp('dragon', clamp(p * 2.2, 0, 1));
            // 眼睛依次亮起（中头先亮，侧头后亮）
            ['dEyeC1', 'dEyeC2', 'dEyeL1', 'dEyeL2', 'dEyeR1', 'dEyeR2'].forEach((id, idx) => {
                $(id).setAttribute('opacity', clamp((p - 0.2 - idx * 0.08) * 3, 0, 1));
            });
            // 团队后退
            const bx = 300 - p * 120;
            teamStand(bx, 6);
            // 喉间火光
            $('throatGlow').setAttribute('opacity', 0.15 + 0.15 * Math.sin(t * 3));
            // ⛓️ 火龙挣扎：被锁链困住，身体前倾想挣脱
            $('dragon').setAttribute('transform', 'translate(640 0) rotate(' + (Math.sin(t * 2.2) * 2.2) + ')');
        },
        // 5 激战·特效刀：火龙喷火，团队跃火拔刀砍杀
        (p) => {
            const c = (t - ST[5]) % 2.2;
            // 喷火（火柱从龙口喷向团队）
            if (Math.random() < 0.5) {
                const fxp = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                fxp.setAttribute('d', 'M560 260 Q 430 280 340 300');
                fxp.setAttribute('stroke', Math.random() < 0.5 ? '#ff9d6e' : '#ff5a3c');
                fxp.setAttribute('stroke-width', 10 + Math.random() * 8);
                fxp.setAttribute('fill', 'none');
                fxp.setAttribute('stroke-linecap', 'round');
                fxp.setAttribute('class', 'fx-spark');
                fxp.style.setProperty('--dx', '-220px');
                fxp.style.setProperty('--dy', (Math.random() * 30 - 15) + 'px');
                $('fx').appendChild(fxp);
                setTimeout(() => fxp.remove(), 600);
            }
            spark(420 + Math.random() * 120, 280 + Math.random() * 60, '#ff9d6e', 3, 50);
            // 团队跃火 + 拔刀
            if (c < 1.1) {
                teamJump(300, (c / 1.1) * Math.PI, 34);   // 跃过火海
            } else {
                teamStand(300, 8);                        // 站定拔刀反击
                const dir = 1;
                $('p1ArmB').setAttribute('transform', 'rotate(' + (-40 - Math.sin(t * 8) * 30) + ' 0 366)');
                // 刀光
                if (Math.random() < 0.4) {
                    spark(430 + Math.random() * 80, 300 + Math.random() * 60, '#ffe9b0', 5, 60);
                    ring(480, 330, '#ffe9b0');
                }
            }
            // 命中龙身（边沿触发）
            if (c > 1.35 && c < 1.5) {
                if (lastHit !== 5) {
                    lastHit = 5;
                    ring(560, 360, '#ffe9b0');
                    spark(560, 360, '#ffd98a', 16, 80);
                    spark(600, 330, '#ff5a3c', 8, 50);
                    quake();
                }
            }
            if (c >= 1.5) { lastHit = -1; }
            // 龙身微震
            $('dragon').setAttribute('transform', 'translate(640 0) rotate(' + (c > 1.35 && c < 1.5 ? 2 : 0) + ')');
        },
        // 6 真相·天上的龙：火龙低头，团队放下刀
        (p) => {
            // 火龙低头
            const tilt = p * 4;
            $('dragon').setAttribute('transform', 'translate(640 0) rotate(' + tilt + ')');
            // 眼睛变温柔
            if (p > 0.3) {
                ['dEyeC1', 'dEyeC2', 'dEyeL1', 'dEyeL2', 'dEyeR1', 'dEyeR2'].forEach(id => {
                    $(id).setAttribute('fill', '#bfe3ff');
                });
            }
            // 团队放下刀，走近
            const bx = 320 + p * 70;
            teamStand(bx, 4);
            $('p1ArmB').setAttribute('transform', 'rotate(' + (24 - p * 34) + ' 0 366)');
            $('throatGlow').setAttribute('opacity', 0.2 + 0.1 * Math.sin(t * 2));
        },
        // 7 放龙·归天：解开锁链，火龙展翅飞回天空
        (p) => {
            // 锁链消失
            $('chains').setAttribute('opacity', clamp(1 - p * 4, 0, 1));
            // 火龙升空：上移 + 缩小 + 扇翅
            const up = p * 200;
            const sc = 1 - p * 0.35;
            $('dragon').setAttribute('transform', 'translate(640 ' + (-up) + ') scale(' + sc + ')');
            // 团队目送（站定仰望，外景立于岸上）
            teamStand(280, 3, -40);
            // 👋 队长挥手告别火龙
            $('p1ArmA').setAttribute('transform', 'rotate(' + (Math.sin(t * 5) * 28 - 40) + ' 0 364)');
            // 🌠 流星同辉
            if (Math.random() < 0.03) { spawnMeteor(); }
            // 上升星光
            if (Math.random() < 0.3) { spark(560 + Math.random() * 160, 300 + Math.random() * 80, '#ffe9b0', 2, 24); }
            // 飞天痕迹
            if (p > 0.75) { ring(620, 150, '#ffd98a'); }
        }
    ];

    // ═══════════ 字幕 ═══════════
    function updateSubtitle() {
        let cur = null;
        for (const L of LINES) { if (t >= L[0] && t < L[0] + L[1]) { cur = L[2]; break; } }
        const el = $('subtitle');
        if (cur !== lastLine) { lastLine = cur; el.textContent = cur || ''; el.style.opacity = cur ? 1 : 0; }
    }

    // ═══════════ 音效（Web Audio 氛围） ═══════════
    function initAudio() {
        try {
            actx = new (window.AudioContext || window.webkitAudioContext)();
            const g = actx.createGain(); g.gain.value = 0.045;
            const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 300;
            const o1 = actx.createOscillator(); o1.type = 'sine'; o1.frequency.value = 55;
            const o2 = actx.createOscillator(); o2.type = 'sine'; o2.frequency.value = 55.6;
            o1.connect(f); o2.connect(f); f.connect(g); g.connect(actx.destination);
            o1.start(); o2.start();
            drone = { g, f, o1, o2 };
        } catch (e) { actx = null; }
    }
    function tone(freq, dur, vol, type) {
        if (!actx) { return; }
        const o = actx.createOscillator(); o.type = type || 'sine'; o.frequency.value = freq;
        const g = actx.createGain();
        g.gain.setValueAtTime(0, actx.currentTime);
        g.gain.linearRampToValueAtTime(vol, actx.currentTime + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
        o.connect(g); g.connect(actx.destination);
        o.start(); o.stop(actx.currentTime + dur + 0.1);
    }
    function onChapterAudio(i) {
        if (!drone) { return; }
        if (i === 5) { drone.f.frequency.value = 900; drone.g.gain.value = 0.075; }
        else if (i === 3) { drone.f.frequency.value = 700; drone.g.gain.value = 0.06; }
        else if (i === 6) { drone.f.frequency.value = 380; drone.g.gain.value = 0.05; }
        else if (i === 7) { drone.f.frequency.value = 220; drone.g.gain.value = 0.04; tone(660, 1.2, 0.03); }
        else { drone.f.frequency.value = 300; drone.g.gain.value = 0.045; }
    }

    // ═══════════ 主循环 ═══════════
    function frame(now) {
        const dt = Math.min((now - last) / 1000, 0.06);
        last = now;
        if (playing) {
            t += dt;
            const i = chIndex();
            if (i !== chapter) { onChapter(i); }
            const prog = clamp((t - ST[i]) / CHS[i].dur, 0, 1);
            if (update[i]) { update[i](prog); }
            updateSubtitle();
            $('progress').style.width = (t / TOTAL * 100) + '%';
            if (t >= TOTAL) {
                playing = false;
                $('pauseBtn').textContent = '▶ 播放';
                $('endCard').classList.add('show');
                if (drone) { drone.g.gain.linearRampToValueAtTime(0.0001, actx.currentTime + 2); }
            }
        }
        requestAnimationFrame(frame);
    }

    // ═══════════ 控制 ═══════════
    function togglePause() {
        if (!playing && t >= TOTAL) { restart(); return; }
        playing = !playing;
        $('pauseBtn').textContent = playing ? '⏸ 暂停' : '▶ 播放';
        if (playing) {
            last = performance.now();
            if (actx) { actx.resume(); }
        } else if (actx) {
            actx.suspend();
        }
    }
    function restart() {
        t = 0; lastLine = null; chapter = -1; lastHit = -1; lastLand = -1;
        $('endCard').classList.remove('show');
        $('progress').style.width = '0%';
        $('subtitle').textContent = ''; $('subtitle').style.opacity = 0;
        ['p1LegA', 'p1LegB', 'p2LegA', 'p2LegB', 'p3LegA', 'p3LegB', 'p1ArmA', 'p1ArmB', 'p1Lantern'].forEach(id => { $(id).setAttribute('transform', ''); });
        // 复位脚下投影透明度（跳跃中途重播不残留淡影）
        ['p1', 'p2', 'p3'].forEach(id => {
            const g = $(id);
            const shEl = g ? g.querySelector('ellipse') : null;
            if (shEl) { shEl.setAttribute('opacity', 1); }
        });
        ['p1', 'p2', 'p3'].forEach(id => { $(id).setAttribute('transform', ''); });
        ['dragon', 'team', 'gInner', 'gOuter'].forEach(id => { $(id).setAttribute('transform', ''); });
        $('dragon').setAttribute('opacity', 0);
        $('chains').setAttribute('opacity', 0.9);
        ['dEyeC1', 'dEyeC2', 'dEyeL1', 'dEyeL2', 'dEyeR1', 'dEyeR2'].forEach(id => {
            $(id).setAttribute('fill', '#ffb347'); $(id).setAttribute('opacity', 0);
        });
        $('trapGrid').setAttribute('opacity', 0.5);
        if (actx && drone) {
            drone.g.gain.cancelScheduledValues(actx.currentTime);
            drone.f.frequency.setValueAtTime(300, actx.currentTime);
            drone.g.gain.setValueAtTime(0.045, actx.currentTime);
            if (actx.state === 'suspended') { actx.resume(); }
        }
        playing = true;
        $('pauseBtn').textContent = '⏸ 暂停';
        last = performance.now();
    }

    // ═══════════ 直接展开（不要收起）：打开即自动播放 ═══════════
    initAudio();
    // 浏览器无手势可能静音音频——首次点击画面时补开
    document.addEventListener('pointerdown', () => {
        if (actx && actx.state === 'suspended') { actx.resume(); }
        $('hint').style.opacity = '0';
    }, { once: true });
    playing = true;
    last = performance.now();
    requestAnimationFrame(frame);
</script>
</body>
</html>
